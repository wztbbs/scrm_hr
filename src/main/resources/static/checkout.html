<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
    }
    .box {
      text-align: center;
      padding: 40px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .msg {
      color: #64748b;
      font-size: 16px;
    }
    .error {
      color: #dc2626;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <div class="msg" id="msg">Loading checkout...</div>
  </div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const priceId = params.get('price_id');
      const customerId = params.get('customer_id');
      const orderId = params.get('order_id');
      const userId = params.get('user_id');
      const planCode = params.get('plan_code');
      const token = params.get('token');
      const env = params.get('env') || 'sandbox';

      const msgEl = document.getElementById('msg');
      const spinnerEl = document.getElementById('spinner');

      if (!priceId || !customerId || !token) {
        spinnerEl.style.display = 'none';
        msgEl.className = 'error';
        msgEl.textContent = 'Missing checkout parameters. Please try again.';
        return;
      }

      try {
        Paddle.Environment.set(env === 'live' ? 'production' : 'sandbox');
        Paddle.Initialize({ token: token });

        Paddle.Checkout.open({
          items: [{ priceId: priceId, quantity: 1 }],
          customer: { id: customerId },
          customData: {
            order_id: orderId ? parseInt(orderId) : null,
            user_id: userId ? parseInt(userId) : null,
            plan_code: planCode || null
          },
          settings: {
            theme: 'light',
            displayMode: 'overlay'
          }
        });
      } catch (e) {
        spinnerEl.style.display = 'none';
        msgEl.className = 'error';
        msgEl.textContent = 'Failed to load checkout: ' + e.message;
        console.error('Paddle checkout error:', e);
      }
    })();
  </script>
</body>
</html>
