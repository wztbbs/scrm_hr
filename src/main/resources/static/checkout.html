<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
    }
    .box {
      text-align: center;
      padding: 40px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .msg {
      color: #64748b;
      font-size: 16px;
    }
    .error {
      color: #dc2626;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <div class="msg" id="msg">Loading checkout...</div>
  </div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const txnId = params.get('txn');
      const env = params.get('env') || 'sandbox';

      const msgEl = document.getElementById('msg');
      const spinnerEl = document.getElementById('spinner');

      if (!txnId) {
        spinnerEl.style.display = 'none';
        msgEl.className = 'error';
        msgEl.textContent = 'Invalid transaction ID. Please try again.';
        return;
      }

      // Paddle Client Token (public, safe to expose in frontend)
      // TODO: Replace with your production client token for live environment
      const CLIENT_TOKEN = 'test_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx';

      try {
        Paddle.Environment.set(env);
        Paddle.Initialize({ token: CLIENT_TOKEN });
        Paddle.Checkout.open({
          transactionId: txnId
          // success/cancel callbacks are handled by Paddle redirecting to return_url/cancel_url
          // configured when the transaction was created on the backend
        });
      } catch (e) {
        spinnerEl.style.display = 'none';
        msgEl.className = 'error';
        msgEl.textContent = 'Failed to load checkout: ' + e.message;
        console.error('Paddle checkout error:', e);
      }
    })();
  </script>
</body>
</html>
