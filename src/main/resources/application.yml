server:
  port: 8080
  address: 127.0.0.1
  servlet:
    context-path: /

spring:
  application:
    name: linkedin-scrm

  datasource:
    url: jdbc:mysql://localhost:3306/admin?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&useSSL=false
    username: admin
    password: ${MYSQL_PASSWORD:w123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

resend:
  api-key: ${RESEND_API_KEY:}

  ai:
    openai:
      # 阿里云百炼兼容模式（OpenAI API 兼容）
      # 注意：base-url 不要带 /v1，Spring AI 内部会自动追加 /v1/chat/completions
      api-key: ${DASHSCOPE_API_KEY:dummy}
      base-url: https://dashscope-us.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-plus
          temperature: 0.3

mybatis:
  mapper-locations: classpath:mapper/*.xml,classpath:mapper/sub/*.xml
  type-aliases-package: com.scrm.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 阿里云百炼不需要 HTTP-Referer / X-Title 等额外 header
# （原 OpenRouter 配置已移除）

paddle:
  api-key: ${PADDLE_API_KEY:}
  webhook-secret: ${PADDLE_WEBHOOK_SECRET:}
  client-token: ${PADDLE_CLIENT_TOKEN:}
  environment: ${PADDLE_ENVIRONMENT:sandbox}
  frontend-url: ${PADDLE_FRONTEND_URL:https://www.hrscrm.net}
  price-ids:
    pro_monthly: ${PADDLE_PRICE_PRO_MONTHLY:}
    pro_yearly: ${PADDLE_PRICE_PRO_YEARLY:}

feedback:
  to-email: ${FEEDBACK_TO_EMAIL:richardtao2001@gmail.com}

support:
  to-email: ${SUPPORT_TO_EMAIL:richardtao2001@gmail.com}

logging:
  level:
    com.scrm: DEBUG
    com.scrm.dao: DEBUG
