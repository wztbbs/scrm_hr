<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your email</title>
    <style>
        body { margin:0; padding:0; background:#f4f4f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
        .container { max-width:480px; margin:40px auto; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .header { background:#5b4cdb; padding:28px; text-align:center; }
        .header h1 { color:#fff; font-size:20px; margin:0; font-weight:700; }
        .body { padding:32px 28px; }
        .greeting { font-size:15px; color:#111; margin-bottom:8px; }
        .desc { font-size:14px; color:#6b7280; line-height:1.6; margin-bottom:24px; }
        .code-box { background:#f8f9fb; border:1px dashed #d1d5db; border-radius:10px; padding:20px; text-align:center; margin-bottom:24px; }
        .code-label { font-size:12px; color:#9ca3af; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
        .code { font-size:32px; font-weight:700; color:#5b4cdb; letter-spacing:6px; font-family:'Courier New',monospace; }
        .expiry { font-size:12px; color:#9ca3af; text-align:center; margin-bottom:24px; }
        .footer { border-top:1px solid #f3f4f6; padding:20px 28px; background:#fafafa; }
        .footer-text { font-size:12px; color:#9ca3af; line-height:1.5; }
        .brand { font-weight:600; color:#5b4cdb; }
    </style>
    <base target="_blank">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>RecruitFlow</h1>
    </div>
    <div class="body">
        <div class="greeting">Hi there,</div>
        <div class="desc">
            You are binding this email to your RecruitFlow account. Use the verification code below to complete the process.
        </div>
        <div class="code-box">
            <div class="code-label">Verification Code</div>
            <div class="code">{{CODE}}</div>
        </div>
        <div class="expiry">This code expires in 10 minutes.</div>
    </div>
    <div class="footer">
        <div class="footer-text">
            If you did not request this, you can safely ignore this email.<br>
            <span class="brand">RecruitFlow</span> Team
        </div>
    </div>
</div>
</body>
</html>
